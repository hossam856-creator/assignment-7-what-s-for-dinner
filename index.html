<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's For Dinner</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <!-- Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom styles -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="wfd-header bg-white shadow-sm">
    <nav class="navbar navbar-expand-md container py-3">
      <a class="navbar-brand d-flex align-items-center gap-3 m-0" href="#">
        <span class="wfd-logo d-flex align-items-center justify-content-center rounded-circle shadow">
          <i class="fa-solid fa-utensils text-white fs-5"></i>
        </span>
        <span>
          <span class="d-block fw-bold fs-5 fs-md-4 text-dark lh-sm">What's For Dinner</span>
          <small class="d-block text-secondary fw-normal">Your daily meal inspiration</small>
        </span>
      </a>

      <button class="navbar-toggler border-0 shadow-none" type="button"
              data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <i class="fa-solid fa-bars fs-3 text-secondary"></i>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="mainNav">
        <ul class="navbar-nav align-items-md-center gap-md-4 pt-3 pt-md-0 mt-3 mt-md-0 border-top border-md-0 wfd-nav">
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center gap-3" href="#" aria-label="Saved recipes">
              <i class="fa-solid fa-bookmark fs-5"></i><span class="d-md-none">Saved Recipes</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center gap-3" href="#" aria-label="Recent">
              <i class="fa-solid fa-clock-rotate-left fs-5"></i><span class="d-md-none">Recent</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center gap-3" href="#" aria-label="Settings">
              <i class="fa-solid fa-gear fs-5"></i><span class="d-md-none">Settings</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center gap-3" href="#" aria-label="Profile">
              <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-4.jpg" alt="" class="wfd-avatar rounded-circle">
              <span class="d-md-none">Profile</span>
            </a>
          </li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- Main -->
  <main class="container py-4 py-md-5">
    <section id="recipe-card" class="card wfd-card border-0 shadow-lg overflow-hidden">
      <div class="row g-0 wfd-card-row">

        <!-- Left: image + quick stats -->
        <div class="col-lg-5 wfd-media position-relative">
          <img id="recipe-image" class="w-100 h-100 object-fit-cover" src="" alt="">
          <div id="recipe-placeholder" class="wfd-placeholder d-none w-100 h-100 align-items-center justify-content-center">
            <i class="fa-solid fa-utensils text-white opacity-75" style="font-size: 5rem;"></i>
          </div>

          <!-- Rating pill -->
          <div class="position-absolute top-0 start-0 m-4 bg-white rounded-pill px-3 py-2 shadow d-flex align-items-center gap-2">
            <i class="fa-solid fa-star text-warning"></i>
            <span class="fw-semibold" id="rating-average"></span>
            <small class="text-secondary" id="rating-quantity"></small>
          </div>

          <!-- Quick stats -->
          <div class="position-absolute bottom-0 start-0 end-0 m-4 wfd-stats rounded-4 p-3 p-md-4 shadow">
            <div class="row text-center g-2">
              <div class="col-4">
                <i class="fa-solid fa-clock fs-4 mb-1 text-orange"></i>
                <div class="small text-secondary">Prep Time</div>
                <div class="fw-bold" id="prep-time-display"></div>
              </div>
              <div class="col-4">
                <i class="fa-solid fa-fire-burner fs-4 mb-1 text-danger"></i>
                <div class="small text-secondary">Cook Time</div>
                <div class="fw-bold" id="cook-time-display"></div>
              </div>
              <div class="col-4">
                <i class="fa-solid fa-users fs-4 mb-1 text-primary"></i>
                <div class="small text-secondary">Servings</div>
                <div class="fw-bold" id="servings-display"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Right: details -->
        <div class="col-lg-7 wfd-details p-4 p-lg-5">
          <div class="d-flex flex-column-reverse flex-md-row justify-content-between align-items-md-start gap-3 mb-4">
            <div>
              <div class="d-flex gap-2 mb-3">
                <span class="badge rounded-pill" id="difficulty-badge"></span>
                <span class="badge rounded-pill bg-primary-subtle text-primary-emphasis" id="category-badge"></span>
              </div>
              <h2 class="fw-bold mb-2" id="recipe-name"></h2>
              <p class="text-secondary mb-0" id="recipe-description"></p>
            </div>
            <div class="d-flex gap-2 align-self-end align-self-md-start">
              <button type="button" class="btn wfd-icon-btn" aria-label="Save recipe"><i class="fa-solid fa-bookmark"></i></button>
              <button type="button" class="btn wfd-icon-btn" aria-label="Share recipe"><i class="fa-solid fa-share-nodes"></i></button>
            </div>
          </div>

          <!-- Long prep warning -->
          <div id="time-warning" class="alert alert-danger border-0 border-start border-4 border-danger d-none align-items-center gap-3" role="alert">
            <i class="fa-solid fa-triangle-exclamation fs-4"></i>
            <div>
              <strong class="d-block">Extended Preparation Time</strong>
              <small>This recipe requires more than 45 minutes to prepare. Plan accordingly!</small>
            </div>
          </div>

          <!-- Tabs (handled by Bootstrap) -->
          <ul class="nav nav-tabs nav-fill wfd-tabs mb-4" id="recipeTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="ingredients-btn" data-bs-toggle="tab" data-bs-target="#ingredients-pane" type="button" role="tab" aria-controls="ingredients-pane" aria-selected="false">
                <i class="fa-solid fa-list-check me-1 me-md-2"></i><span>Ingredients</span>
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="instructions-btn" data-bs-toggle="tab" data-bs-target="#instructions-pane" type="button" role="tab" aria-controls="instructions-pane" aria-selected="true">
                <i class="fa-solid fa-book-open me-1 me-md-2"></i><span>Instructions</span>
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="nutrition-btn" data-bs-toggle="tab" data-bs-target="#nutrition-pane" type="button" role="tab" aria-controls="nutrition-pane" aria-selected="false">
                <i class="fa-solid fa-chart-pie me-1 me-md-2"></i><span>Nutrition</span>
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="tips-btn" data-bs-toggle="tab" data-bs-target="#tips-pane" type="button" role="tab" aria-controls="tips-pane" aria-selected="false">
                <i class="fa-solid fa-lightbulb me-1 me-md-2"></i><span>Chef's Tips</span>
              </button>
            </li>
          </ul>

          <div class="tab-content wfd-tab-content">
            <div class="tab-pane fade" id="ingredients-pane" role="tabpanel" aria-labelledby="ingredients-btn" tabindex="0">
              <div class="wfd-soft-box rounded-4 p-4">
                <ul class="list-unstyled mb-0 d-flex flex-column gap-3" id="ingredients-list"></ul>
              </div>
            </div>

            <div class="tab-pane fade show active" id="instructions-pane" role="tabpanel" aria-labelledby="instructions-btn" tabindex="0">
              <div class="d-flex flex-column gap-4" id="instructions-list"></div>
            </div>

            <div class="tab-pane fade" id="nutrition-pane" role="tabpanel" aria-labelledby="nutrition-btn" tabindex="0">
              <div class="row g-3" id="nutrition-list"></div>
            </div>

            <div class="tab-pane fade" id="tips-pane" role="tabpanel" aria-labelledby="tips-btn" tabindex="0">
              <div class="d-flex flex-column gap-3" id="tips-list"></div>
            </div>
          </div>

          <div class="mt-4 pt-4 border-top">
            <button id="try-another-btn" type="button" class="btn btn-wfd rounded-3 px-4 py-2 fw-semibold shadow">
              <i class="fa-solid fa-rotate me-2"></i>Try Another Recipe
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
